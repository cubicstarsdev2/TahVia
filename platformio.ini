; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.1

; TFT pins/driver come from your own User_Setup.h (nothing defined here).
; Your setup must have LOAD_GFXFF enabled (the free fonts are used).
build_flags =
    -DBATT_STATIC_PCT=100       ; fixed battery % (no battery connected). Remove for real readings.
    ; -DBATT_ADC_PIN=34         ; real battery: ADC1 pin behind a divider
    ; -DBATT_DIVIDER=2.0f